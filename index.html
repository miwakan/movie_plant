<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Loop / Blackout</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; background: #000; display: none; }
  #stage.on { display: block; }
  #stage.hidecursor, #stage.hidecursor * { cursor: none; }
  video { width: 100%; height: 100%; object-fit: contain; opacity: 0; display: block; background: #000; }
  #setup { max-width: 560px; margin: 6vh auto; padding: 28px; background: #151515; border-radius: 12px; }
  h1 { font-size: 20px; margin: 0 0 18px; color: #fff; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: #aaa; }
  input[type=number], select { background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 6px 8px; font-size: 15px; }
  input[type=number] { width: 90px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #drop { border: 2px dashed #444; border-radius: 10px; padding: 22px; text-align: center; color: #888; cursor: pointer; }
  #drop.over { border-color: #8af; color: #cde; }
  #drop.ok { border-color: #4a6; color: #cfc; }
  button { margin-top: 22px; width: 100%; padding: 12px; font-size: 16px; border: 0; border-radius: 8px;
    background: #3a6df0; color: #fff; cursor: pointer; }
  button:disabled { background: #333; color: #777; cursor: default; }
  table { margin-top: 20px; border-collapse: collapse; font-size: 13px; width: 100%; }
  td { padding: 4px 6px; border-top: 1px solid #262626; }
  td:first-child { white-space: nowrap; color: #fff; width: 110px; }
  kbd { background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  #toast { position: fixed; left: 16px; bottom: 16px; padding: 6px 12px; background: rgba(40,40,40,.85);
    color: #fff; font-size: 14px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10; }
</style>
</head>
<body>

<div id="setup">
  <h1>ループ動画 ⇄ 暗転 切り替え</h1>

  <div id="drop">動画ファイルをドロップ、またはクリックして選択</div>
  <input type="file" id="file" accept="video/*" hidden>

  <label>フェード時間（秒）</label>
  <div class="row">
    <span style="font-size:14px">イン</span><input type="number" id="fadeIn" value="2" min="0" max="60" step="0.1">
    <span style="font-size:14px">アウト</span><input type="number" id="fadeOut" value="2" min="0" max="60" step="0.1">
  </div>
  <div style="font-size:13px;color:#888;margin-top:6px">再生中も ↑↓（イン）、←→（アウト）で 0.5 秒ずつ変更可</div>

  <label>フェードカーブ</label>
  <select id="curve">
    <option value="smooth">なめらか（両端をゆっくり・おすすめ）</option>
    <option value="linear">リニア（一定の速さ）</option>
  </select>

  <label>開始時の状態</label>
  <select id="startState">
    <option value="black">暗転から始める（Space でフェードイン）</option>
    <option value="video">映像から始める</option>
  </select>

  <label><input type="checkbox" id="audio" checked> 音声もフェードする（音声なしにする場合はオフ→ミュート）</label>
  <label><input type="checkbox" id="pause"> 暗転中は動画を一時停止（オフ＝裏で再生し続ける）</label>
  <label><input type="checkbox" id="toastOpt"> 操作時に画面左下へ状態表示を出す（本番ではオフ推奨）</label>

  <button id="start" disabled>開始（全画面）</button>

  <table>
    <tr><td><kbd>Space</kbd> / <kbd>Enter</kbd></td><td>映像 ⇄ 暗転（フェード）</td></tr>
    <tr><td><kbd>B</kbd></td><td>暗転へ</td></tr>
    <tr><td><kbd>V</kbd></td><td>映像へ</td></tr>
    <tr><td><kbd>X</kbd></td><td>フェードなしで即切り替え</td></tr>
    <tr><td><kbd>↑</kbd> / <kbd>↓</kbd></td><td>フェードイン時間 ±0.5 秒</td></tr>
    <tr><td><kbd>→</kbd> / <kbd>←</kbd></td><td>フェードアウト時間 ±0.5 秒</td></tr>
    <tr><td><kbd>R</kbd></td><td>動画を頭出し</td></tr>
    <tr><td><kbd>F</kbd></td><td>全画面のオン／オフ</td></tr>
    <tr><td><kbd>H</kbd></td><td>状態表示のオン／オフ</td></tr>
    <tr><td><kbd>Esc</kbd></td><td>全画面解除（もう一度 Esc で設定画面へ戻る）</td></tr>
  </table>
</div>

<div id="stage"><video id="vid" loop playsinline preload="auto"></video></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const vid = $('vid'), stage = $('stage'), setup = $('setup');
let url = null, running = false;
let level = 0, target = 0, fadeIn = 2, fadeOut = 2, curve = 'smooth', lastT = 0, toastOn = false, toastTimer;

// ---- file pick ----
function loadFile(f) {
  if (!f || !f.type.startsWith('video/')) return;
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(f);
  vid.src = url;
  $('drop').textContent = '✓ ' + f.name;
  $('drop').classList.add('ok');
  $('start').disabled = false;
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
document.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

// ---- start / stop ----
$('start').onclick = async () => {
  fadeIn  = Math.max(0, parseFloat($('fadeIn').value)  || 0);
  fadeOut = Math.max(0, parseFloat($('fadeOut').value) || 0);
  curve = $('curve').value;
  $('start').blur();
  toastOn = $('toastOpt').checked;
  vid.muted = !$('audio').checked;
  level = target = ($('startState').value === 'video') ? 1 : 0;
  apply();
  setup.style.display = 'none';
  stage.classList.add('on');
  running = true;
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  if (level > 0 || !$('pause').checked) vid.play().catch(()=>{});
  lastT = performance.now();
  requestAnimationFrame(tick);
};

function backToSetup() {
  running = false;
  vid.pause();
  stage.classList.remove('on');
  setup.style.display = '';
  $('fadeIn').value = fadeIn;
  $('fadeOut').value = fadeOut;
}

// ---- fade engine ----
// level: 0→1 の進行度（時間に比例）。表示・音量にはカーブをかけて反映する
function apply() {
  const x = Math.min(1, Math.max(0, level));
  const v = curve === 'smooth' ? x * x * (3 - 2 * x) : x;   // smoothstep
  vid.style.opacity = v;
  // 音量は耳の感じ方に合わせて二乗カーブ（直線だと最後に急に消えたように聞こえる）
  if (!vid.muted) vid.volume = v * v;
}
function tick(t) {
  if (!running) return;
  const dt = (t - lastT) / 1000; lastT = t;
  if (level !== target) {
    const sec = target > level ? fadeIn : fadeOut;
    const step = sec > 0 ? dt / sec : 1;
    level = target > level ? Math.min(target, level + step) : Math.max(target, level - step);
    apply();
    if (level === 0 && target === 0 && $('pause').checked) vid.pause();
  }
  requestAnimationFrame(tick);
}
function go(to, instant) {
  target = to;
  if (to === 1 && vid.paused) vid.play().catch(()=>{});
  if (instant) { level = to; apply(); if (to === 0 && $('pause').checked) vid.pause(); }
  toast(to ? (instant ? '映像（即）' : '映像へフェード') : (instant ? '暗転（即）' : '暗転へフェード'));
}

// ---- toast ----
function toast(msg) {
  if (!toastOn) return;
  const el = $('toast'); el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 1500);
}

// ---- cursor auto-hide ----
let curTimer;
document.addEventListener('mousemove', () => {
  stage.classList.remove('hidecursor');
  clearTimeout(curTimer); curTimer = setTimeout(() => stage.classList.add('hidecursor'), 1000);
});
stage.classList.add('hidecursor');

const adj = (s, d) => Math.max(0, Math.round((s + d) * 10) / 10);

// ---- keys ----
document.addEventListener('keydown', e => {
  if (!running) return;
  const k = e.key;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); go(target ? 0 : 1); }
  else if (k === 'b' || k === 'B') go(0);
  else if (k === 'v' || k === 'V') go(1);
  else if (k === 'x' || k === 'X') go(target ? 0 : 1, true);
  else if (k === 'ArrowUp')    { e.preventDefault(); fadeIn  = adj(fadeIn,  0.5); toast('フェードイン ' + fadeIn + ' 秒'); }
  else if (k === 'ArrowDown')  { e.preventDefault(); fadeIn  = adj(fadeIn, -0.5); toast('フェードイン ' + fadeIn + ' 秒'); }
  else if (k === 'ArrowRight') { e.preventDefault(); fadeOut = adj(fadeOut,  0.5); toast('フェードアウト ' + fadeOut + ' 秒'); }
  else if (k === 'ArrowLeft')  { e.preventDefault(); fadeOut = adj(fadeOut, -0.5); toast('フェードアウト ' + fadeOut + ' 秒'); }
  else if (k === 'r' || k === 'R') { vid.currentTime = 0; toast('頭出し'); }
  else if (k === 'h' || k === 'H') { toastOn = !toastOn; toastOn ? toast('状態表示 ON') : ($('toast').style.opacity = 0); }
  else if (k === 'f' || k === 'F') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{});
  }
  else if (k === 'Escape' && !document.fullscreenElement) backToSetup();
});
</script>
</body>
</html>
